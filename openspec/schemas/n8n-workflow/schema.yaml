name: n8n-workflow
version: 1
description: SDD для воркфлоу n8n - proposal → specs → design → tasks, с обязательным экспортом JSON в репозиторий
artifacts:
  - id: proposal
    generates: proposal.md
    description: Зачем меняем воркфлоу и какие воркфлоу затронуты
    template: proposal.md
    instruction: |
      Создай proposal.md — ПОЧЕМУ нужно изменение. Пиши по-русски, заголовки оставляй как в шаблоне.

      Разделы:
      - **Why**: 1–2 фразы — какая бизнес-проблема, почему сейчас.
      - **What Changes**: список изменений в поведении. Ломающие изменения контракта входа/выхода помечай **BREAKING**.
      - **Capabilities**: одна capability = один воркфлоу n8n. Имя capability = имя воркфлоу в n8n = имя файла workflows/<имя>.json (kebab-case).
        - **New Capabilities**: новые воркфлоу. Каждый станет `specs/<имя>/spec.md`.
        - **Modified Capabilities**: существующие воркфлоу, у которых меняются требования (не реализация). Точный путь из `openspec/specs/`. Пусто, если требования не меняются.
      - **Impact**: внешние системы, имена credentials (без значений), другие воркфлоу, которые вызывают или вызываются этим.

      Перед заполнением Capabilities посмотри инвентарь: `openspec list --specs`, затем
      `openspec show "<spec-id>" --type spec` для связанных воркфлоу. Не плоди
      почти одинаковые имена — переиспользуй существующий путь.

      Изменение обязано объявить хотя бы одну capability или явно отказаться от спек
      (`skip_specs: true` в `.openspec.yaml`) — только для правок, не меняющих поведение
      (косметика, инструменты, документация). Не выдумывай требование ради валидации.

      Коротко, до одной страницы. «Как» — в design.md.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Поведенческий контракт воркфлоу
    template: spec.md
    instruction: |
      Создай спеку — ЧТО делает воркфлоу, наблюдаемое снаружи. Пиши по-русски,
      структурные заголовки и слова SHALL/MUST — по-английски.

      Спека — контракт поведения, не схема узлов. В спеке ЗАПРЕЩЕНО:
      - названия и типы нод n8n, выражения `{{ $json... }}`
      - конкретные библиотеки и способы реализации
      Всё это — в design.md.

      Один файл на capability из proposal: `specs/<имя-воркфлоу>/spec.md`.
      Для существующего воркфлоу — точный путь из `openspec/specs/`, проверь через `openspec list --specs`.

      Формат — только через Requirement-блоки, произвольные разделы не добавляй
      (парсер OpenSpec их не сохранит при архивации):
      - `### Requirement: <имя>` + текст с SHALL/MUST
      - `#### Scenario: <имя>` строго с четырьмя решётками, внутри `- **WHEN**` / `- **THEN**`
      - У каждого Requirement минимум один Scenario.

      Для НОВОГО воркфлоу спека начинается с `## Purpose` (1–2 фразы, от 50 символов)
      и обязательно содержит шесть служебных Requirement-блоков, затем бизнес-требования:
      1. `### Requirement: Trigger` — что запускает воркфлоу (вебхук / расписание / событие / вызов из другого воркфлоу), частота, ожидаемая нагрузка.
      2. `### Requirement: Input contract` — структура входа словами и ссылка на JSON Schema в `tests/<имя>/input.schema.json`, если контракт нетривиальный. Что делать с невалидным входом.
      3. `### Requirement: Output and side effects` — что возвращает, куда пишет, кого уведомляет.
      4. `### Requirement: Error handling` — поведение при недоступности каждой внешней системы: повторы, таймауты, куда попадает ошибка.
      5. `### Requirement: Idempotency` — что происходит при повторном запуске с теми же данными. Если идемпотентность невозможна — сказать явно и почему.
      6. `### Requirement: Credentials` — какие внешние системы нужны, имена credentials в n8n. Значения секретов запрещены.
      Для существующего воркфлоу `## Purpose` не добавляй.

      Операции дельты (заголовки `##`):
      - **ADDED Requirements** — новые требования
      - **MODIFIED Requirements** — изменённое поведение, ОБЯЗАТЕЛЬНО полный текст блока (скопируй из `openspec/specs/<имя>/spec.md`, отредактируй)
      - **REMOVED Requirements** — с **Reason** и **Migration**
      - **RENAMED Requirements** — FROM:/TO:

      Каждый Scenario — будущий тест-кейс `tests/<имя>/case-NN.input.json` + `case-NN.expected.json`.
      Формулируй WHEN/THEN так, чтобы их можно было записать в JSON входа и ожидаемого выхода.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Карта узлов, credentials, Code-ноды, Error Workflow, окружение
    template: design.md
    instruction: |
      Создай design.md — КАК воркфлоу реализован в n8n. Для воркфлоу design.md ОБЯЗАТЕЛЕН,
      это единственное место, где допускается уровень нод. Пиши по-русски.

      Разделы (все обязательны, если раздел пуст — напиши «нет» и почему):
      - **Context**: текущее состояние воркфлоу и ограничения. Мотивацию не повторяй — ссылка на proposal.md.
      - **Node map**: последовательность узлов: имя ноды → тип → за какое требование спеки отвечает. Ветвления и циклы — словами или mermaid-диаграммой. Первым узлом всегда Sticky Note с путём к спеке.
      - **Credentials**: таблица: внешняя система → имя credential в n8n → какие права нужны. Без значений.
      - **Code nodes**: список Code-нод: имя → что делает → оценка размера. Больше 50 строк запрещено — укажи, куда выносим.
      - **Error Workflow**: какой Error Workflow назначен, куда идут уведомления, что логируется.
      - **Environment**: инстанс один и рабочий. Переменные окружения, webhook-пути, расписания. Какие записи во внешние системы делают тесты и как их избежать (тестовые записи, pin data).
      - **Decisions**: ключевые решения с альтернативами (почему X, а не Y).
      - **Risks / Trade-offs**: [Риск] → как смягчаем.
      - **Open Questions**: только то, что можно решить позже без изменения спеки и задач. Если вопрос меняет спеку — спроси пользователя сейчас.
    requires:
      - proposal
      - specs

  - id: tasks
    generates: tasks.md
    description: Чеклист внедрения с обязательным хвостом проверки и фиксации
    template: tasks.md
    instruction: |
      Создай tasks.md — чеклист внедрения. Пиши по-русски.

      Перед этим проверь Open Questions в design.md: если что-то меняет объём работы — сначала спроси пользователя.

      **ВАЖНО: строго следуй шаблону.** Фаза apply парсит чекбоксы `- [ ] X.Y`.

      Правила:
      - Группы под заголовками `## N.`
      - Каждая задача — чекбокс `- [ ] X.Y Описание — проверка: <команда / тест-кейс / наблюдаемое поведение>`
      - Задачи упорядочены по зависимостям, каждая выполнима за один сеанс.
      - Сборка воркфлоу делается через n8n MCP или REST API n8n, не правкой JSON руками.

      Типовые группы:
      1. Тест-кейсы: по одному `tests/<имя>/case-NN.*.json` на каждый Scenario спеки, до сборки воркфлоу.
      2. Сборка / правка воркфлоу в n8n: по Node map из design.md, включая Sticky Note и Error Workflow. Новый воркфлоу — выключенным. Правка активного — с согласия пользователя.
      3. Прогон тест-кейсов через тестовый воркфлоу или pin data.
      4. Последняя группа ВСЕГДА такая, без изменений (только подставь имя воркфлоу):

      ```
      ## N. Проверка и фиксация

      - [ ] N.1 Все тест-кейсы tests/<имя>/ проходят — проверка: результат прогона совпадает с case-*.expected.json
      - [ ] N.2 Экспорт и нормализация — проверка: `npm run export -- <имя>` обновил workflows/<имя>.json, `git diff` показывает только ожидаемые изменения
      - [ ] N.3 Конституция соблюдена — проверка: Sticky Note со ссылкой на спеку, Error Workflow назначен, Code-ноды ≤ 50 строк, в JSON нет секретов (`npm run check -- <имя>`)
      - [ ] N.4 Спека и JSON закоммичены вместе — проверка: один коммит содержит openspec/changes/<change>/ и workflows/<имя>.json
      - [ ] N.5 Воркфлоу активирован с согласия пользователя — проверка: пользователь подтвердил, в n8n active=true
      ```
    requires:
      - specs
      - design

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Прочитай proposal, спеку, design и tasks. Иди по задачам по порядку, отмечай выполненные.
    Воркфлоу собирай через n8n MCP или REST API, затем экспортируй в workflows/ через npm run export.
    Останавливайся при блокерах, при обнаружении секретов в артефактах и при расхождении спеки с тем, что уже есть в n8n.

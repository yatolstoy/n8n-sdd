schema: n8n-workflow

context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Проект: автоматизации на n8n. Источник правды — этот git-репозиторий,
  а не редактор n8n. n8n — среда исполнения, куда воркфлоу деплоятся импортом.

  Структура репозитория:
  - openspec/specs/<workflow>/spec.md — актуальная спека каждого воркфлоу (одна capability = один воркфлоу)
  - openspec/changes/<change>/ — предложения изменений (proposal, specs-дельта, design, tasks)
  - workflows/<workflow>.json — экспорт воркфлоу из n8n, нормализованный скриптом scripts/normalize-workflow.mjs
  - tests/<workflow>/case-NN.input.json и case-NN.expected.json — тест-кейсы, по одному на сценарий спеки
  - scripts/ — экспорт, импорт, нормализация

  Конституция проекта (нерушимые правила):
  1. Имя воркфлоу в n8n равно имени capability (kebab-case). Файл workflows/<имя>.json называется так же.
  2. Секреты только в credentials n8n. В спеках, дизайне и JSON — только имена credentials, никогда значения.
  3. Каждый воркфлоу первым узлом сверху имеет Sticky Note с путём к спеке: openspec/specs/<имя>/spec.md.
  4. У каждого продуктивного воркфлоу назначен Error Workflow (settings.errorWorkflow).
  5. Code-нода не длиннее 50 строк. Больше — выносим в отдельный сервис или кастомную ноду, в n8n остаётся оркестрация.
  6. Каждый сценарий спеки (#### Scenario) имеет тест-кейс в tests/<имя>/.
  7. Спека и JSON воркфлоу меняются только вместе, в одном коммите. Правка воркфлоу без изменения спеки запрещена, кроме чисто косметической (позиции узлов).
  8. Идемпотентность: повторный запуск воркфлоу с теми же входными данными не создаёт дублей и не ломает результат. Если это невозможно — спека явно говорит об этом.
  9. Стенд один — рабочий инстанс n8n, отдельного тестового нет. Новый воркфлоу создаётся выключенным и активируется
     только после прохождения тестов и с согласия пользователя. Правка активного воркфлоу — только с согласия пользователя.
     Тесты с записью во внешние системы — только на тестовых записях или через pin data.

  Инструменты агента: MCP-сервер n8n-mcp подключён через .mcp.json (ключи из .env). Воркфлоу собираются
  инструментом n8n_create_workflow, правятся n8n_update_partial_workflow, проверяются n8n_validate_workflow
  и n8n_test_workflow. Экспорт в workflows/ — только командой npm run export (она нормализует JSON).

rules:
  proposal:
    - Не больше одной страницы. Одна capability = один воркфлоу n8n.
    - В разделе Impact перечислить затронутые внешние системы и имена credentials.
  specs:
    - Спека описывает поведение воркфлоу, не узлы. Названия нод n8n, выражения и типы узлов в спеке запрещены — они живут в design.md.
    - Обязательные Requirement-блоки для нового воркфлоу — Trigger, Input contract, Output and side effects, Error handling, Idempotency, Credentials. Далее — бизнес-требования.
    - Каждый Scenario должен быть проверяем тест-кейсом в tests/<workflow>/.
  design:
    - design.md обязателен для каждого изменения воркфлоу. Только здесь допускается уровень нод n8n.
    - Обязательные разделы — Node map, Credentials, Code nodes, Error Workflow, Environment.
  tasks:
    - Последняя группа задач всегда фиксированная — Проверка и фиксация. Не удалять и не сокращать её.
    - Каждая задача содержит способ проверки — команда, тест-кейс, наблюдаемое поведение.

operations:
  apply:
    guidance:
      - Воркфлоу собирать через n8n MCP или REST API n8n, а не редактированием JSON руками.
      - Инстанс рабочий (правило 9). Новый воркфлоу создавать выключенным, активный не трогать без согласия пользователя.
      - После сборки прогнать все tests/<workflow>/case-*.input.json и сравнить с case-*.expected.json.
      - Затем npm run export -- <workflow> (экспорт и нормализация в workflows/<workflow>.json) и коммит вместе со спекой.
      - Активация воркфлоу — последний шаг, только после явного согласия пользователя.
      - Секреты в JSON или артефактах — стоп и сообщить пользователю.
  archive:
    guidance:
      - Перед архивацией убедиться, что workflows/<workflow>.json обновлён и все тест-кейсы проходят.
      - Коротко перечислить, какие требования спеки изменились после слияния дельты.
